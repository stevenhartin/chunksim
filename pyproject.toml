[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fray-claude"
version = "0.1.0"
description = "Offline tooling for source-chunk map state"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fray = "fray_claude.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
# Lets the system mypy resolve intra-package imports without an install.
mypy_path = "src"
