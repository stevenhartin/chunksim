[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chunksim"
version = "1.0.0"
description = "Offline tooling for source-chunk map state"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# The DPS calculator that `dps_bridge.py` prices kills with. Optional because
# `chunksim estimate` falls back to the scraped wiki rates without it, and
# because nothing else in the project may assume it is installed. It used to be
# a licence boundary as well - osrs-dps is GPL-3.0 where this was MIT - and
# that half went away when this project became GPL-3.0-or-later to match. Not
# on PyPI yet; install it from a checkout with `pip install -e ../osrs-dps`.
dps = ["osrs-dps"]

[project.scripts]
chunksim = "chunksim.cli:main"
chunksim-gui = "chunksim.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

# The GUI's html/js/css, and the hand-written heuristic corrections. Both are
# ours and both have to travel with the code: an install without the
# corrections prices every estimate differently from the checkout they were
# measured on, and says nothing about why. The map tiles are deliberately *not*
# here, and are not fetched either: they are the OSRS wiki's cartography,
# CC BY-NC-SA 3.0 against this project's GPL-3.0, so the browser loads them from
# the wiki directly and nothing this project ships or caches carries one.
# cache/assets/ holds section masks and skill icons, not artwork.
[tool.setuptools.package-data]
chunksim = ["gui/resources/*", "heuristics/*.json"]

[tool.pytest.ini_options]
# The opt-in oracles. `conftest.pytest_collection_modifyitems` turns these into
# skips when their inputs are absent, so a fresh clone stays green; registering
# them here is what keeps an unknown-marker warning from hiding a typo.
markers = [
    "real_export: needs the real chunk export (CHUNKSIM_CHUNKINFO)",
    "real_cache: needs the export and this checkout's own populated cache/ (CHUNKSIM_MAP_CACHE)",
    "slow: minutes rather than seconds; also needs CHUNKSIM_SLOW_ORACLES",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
# Lets the system mypy resolve intra-package imports without an install.
mypy_path = "src"
# pytest is a dev extra in .venv, not a system package, so point the system
# mypy at the venv's interpreter to find its stubs.
python_executable = ".venv/bin/python"
