<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fray — world map</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<canvas id="canvas"></canvas>

<!-- One sprite, referenced by `<use href="#i-monster">`. Inline rather than a
     file because it is a dozen paths and a request is a request; drawn on a
     24-unit grid with a 2-unit stroke so every icon has the same weight at
     every size. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-monster"><path d="M12 3a7 7 0 0 0-7 7v4l2 2v4h10v-4l2-2v-4a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="11" r="1.4"/><circle cx="14.5" cy="11" r="1.4"/><path d="M10 20v-3M14 20v-3"/></g>
    <g id="i-npc"><circle cx="12" cy="8" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/></g>
    <g id="i-object"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></g>
    <g id="i-shop"><path d="M4 8h16l-1.2 12H5.2z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/></g>
    <g id="i-spawn"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3"/></g>
    <g id="i-quest"><path d="M6 3h9l3 3v15H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></g>
    <g id="i-clue"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g>
    <g id="i-diary"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M7 20a2 2 0 0 1 0-4h11"/></g>
    <g id="i-sections"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></g>
    <g id="i-log"><path d="M4 5h12a2 2 0 0 1 2 2v13H6a2 2 0 0 1-2-2z"/><path d="m14 9 1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z"/></g>
    <g id="i-unlock"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></g>
    <g id="i-star"><path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.8 6.7 19.7l1.1-6.1L3.4 9.4l6-.8z"/></g>
    <g id="i-dot"><circle cx="12" cy="12" r="4"/></g>
    <g id="i-eye"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></g>
    <g id="i-help"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.2a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.2-2.6 4"/><circle cx="12" cy="17.4" r="1.1" fill="currentColor" stroke="none"/></g>
    <g id="i-close"><path d="m6 6 12 12M18 6 6 18"/></g>
    <g id="i-layers"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></g>
    <g id="i-down"><path d="m6 9 6 6 6-6"/></g>
    <g id="i-up"><path d="m6 15 6-6 6 6"/></g>
    <g id="i-prev"><path d="m15 6-6 6 6 6"/></g>
    <g id="i-next"><path d="m9 6 6 6-6 6"/></g>
    <g id="i-clock"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g>
  </defs>
</svg>

<!-- Which mode, in colour, with the map named on it. The page has always had
     modes; what it lacked was anywhere to say so, which left the user to infer
     one from the fact that a button had gone grey. The tint is a CSS decision
     keyed off `data-mode`, so the palette lives in one file. -->
<div id="ribbon" class="ribbon" data-mode="browse">
  <span id="ribbon-mode" class="ribbon-mode">Browse</span>
  <span id="ribbon-map" class="ribbon-map mono">no map</span>
  <!-- Diff's own controls. The base map keeps the picker it has in every
       other mode; what the ribbon adds is the other side of the pair, so it
       is changeable without leaving the mode that needed it. -->
  <span id="ribbon-vs" class="vs" hidden>vs</span>
  <select id="compare" class="pick pick-thin" aria-label="Compare against" hidden><option value="">—</option></select>
  <!-- Edit's own controls: what is waiting, and the one button that writes
       it. The count is the whole feedback loop for a mode that deliberately
       computes nothing until you press Commit. -->
  <span id="ribbon-edits" class="ribbon-edits" hidden></span>
  <button id="do-commit" type="button" class="thin" hidden
          data-tip="&lt;b&gt;Write these changes as a new map&lt;/b&gt;&lt;span class='sub'&gt;Under cache/maps/edited/. Nothing existing is touched.&lt;/span&gt;">Commit</button>
  <button id="breakdown" type="button" class="thin" hidden disabled
          data-tip="&lt;b&gt;What these two maps actually differ by&lt;/b&gt;&lt;span class='sub'&gt;Sections, tasks, sources and BiS, both directions.&lt;/span&gt;&lt;span class='hint'&gt;Derives both sides — about two seconds&lt;/span&gt;">Breakdown</button>
</div>

<!-- The bar floats over the map rather than sitting above it, so the world
     keeps the whole window and the pan arithmetic stays in one space. -->
<header class="bar">
  <span class="brand">fray</span>

  <select id="map" class="pick" aria-label="Map"></select>
  <!-- Comparing is a mode, not a second dropdown sitting permanently beside
       the first. The pair it needs lives in the ribbon, where the mode is
       announced; this is the door. -->
  <button id="compare-start" type="button"
          data-tip="&lt;b&gt;Compare with another map&lt;/b&gt;&lt;span class='sub'&gt;Enters diff view: gains green, losses red, both selectors on the ribbon.&lt;/span&gt;">Compare</button>

  <span class="rule"></span>

  <!-- The floor. Every rendered region has up to four, and a dungeon's
       interesting half is often not on the ground one. -->
  <select id="plane" class="pick" aria-label="Plane" data-tip="&lt;b&gt;Floor to draw&lt;/b&gt;&lt;span class='sub'&gt;Above ground level the floor below is sunk so this one stands out.&lt;/span&gt;">
    <option value="0">Plane 0</option>
    <option value="1">Plane 1</option>
    <option value="2">Plane 2</option>
    <option value="3">Plane 3</option>
  </select>

  <button id="candidates" class="toggle" type="button" aria-pressed="false"
          data-tip="&lt;b&gt;Candidates&lt;/b&gt;&lt;span class='sub'&gt;The chunks you could roll next, numbered as source-chunk numbers them.&lt;/span&gt;&lt;span class='hint'&gt;C&lt;/span&gt;">Candidates</button>
  <button id="masks" class="toggle" type="button" aria-pressed="false"
          data-tip="&lt;b&gt;Sections&lt;/b&gt;&lt;span class='sub'&gt;Shade inside each chunk: green where you can reach, red where you cannot.&lt;/span&gt;&lt;span class='hint'&gt;S&lt;/span&gt;">Sections</button>
  <button id="live" class="toggle on" type="button" aria-pressed="true"
          data-tip="&lt;b&gt;Live&lt;/b&gt;&lt;span class='sub'&gt;Re-read the cache every two seconds, so a fray fetch in a terminal shows up here.&lt;/span&gt;">Live</button>
  <button id="fit" type="button" data-tip="&lt;b&gt;Fit&lt;/b&gt;&lt;span class='sub'&gt;Frame everything this map holds.&lt;/span&gt;&lt;span class='hint'&gt;Home&lt;/span&gt;">Fit</button>

  <span class="counts" id="counts"></span>
  <button id="skipped" class="warn" type="button" hidden></button>

  <span class="spacer"></span>
  <span class="hover" id="hover"></span>
  <button id="toggle-panel" type="button" data-tip="&lt;b&gt;Panel&lt;/b&gt;&lt;span class='sub'&gt;Hide it to give the map the whole window.&lt;/span&gt;&lt;span class='hint'&gt;P&lt;/span&gt;">Panel</button>
</header>

<aside class="panel" id="panel">
  <nav class="tabs" id="tabs">
    <button data-tab="tasks" class="on" type="button">Tasks</button>
    <button data-tab="chunk" type="button">Chunk</button>
    <button data-tab="find" type="button">Find</button>
    <button data-tab="estimate" type="button">Estimate</button>
    <button data-tab="maps" type="button">Maps</button>
  </nav>

  <section class="pane on" data-pane="tasks">
    <div class="pane-head">
      <div class="chips" id="task-chips"></div>
      <button id="show-done" class="icon-btn" type="button" aria-pressed="false"
              data-tip="&lt;b&gt;Show what is done&lt;/b&gt;&lt;span class='sub'&gt;Swap every list from outstanding to completed.&lt;/span&gt;">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-eye"/></svg>
      </button>
    </div>
    <div id="tasks-body" class="empty">Loading…</div>
  </section>

  <section class="pane" data-pane="chunk">
    <div id="chunk-head"></div>
    <div class="chips" id="chunk-chips"></div>
    <div id="chunk-body" class="empty">Click a chunk on the map.</div>
  </section>

  <section class="pane" data-pane="find">
    <form id="find-form" class="row">
      <input id="find-input" type="search" placeholder="Item, monster, NPC, object…" autocomplete="off">
    </form>
    <div id="find-body" class="empty">Search the whole world, unlocked or not.</div>
  </section>

  <section class="pane" data-pane="estimate">
    <div class="pane-head">
      <span class="pane-title" id="estimate-total"></span>
      <button id="estimate-why" class="icon-btn" type="button" data-tip="&lt;b&gt;Where these numbers come from&lt;/b&gt;&lt;span class='sub'&gt;The export carries no durations at all — every hour here is scraped or hand-corrected.&lt;/span&gt;">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-help"/></svg>
      </button>
    </div>
    <div id="estimate-body" class="empty">Loading…</div>
  </section>

  <section class="pane" data-pane="maps">
    <div id="maps-body" class="empty">Loading…</div>
  </section>
</aside>

<!-- Work that takes time gets a card in the top right of the map, not a
     status line the weight of the hover readout. -->
<div class="progress" id="progress" role="status" aria-live="polite" hidden>
  <div class="progress-head">
    <span class="progress-title" id="progress-title"></span>
    <span class="progress-count" id="progress-count"></span>
    <button id="progress-cancel" class="icon-btn" type="button" hidden aria-label="Stop"
            data-tip="&lt;b&gt;Stop this&lt;/b&gt;&lt;span class='sub'&gt;Every roll already finished is kept and cached; the run just ends short.&lt;/span&gt;&lt;span class='hint'&gt;It stops after the roll in progress&lt;/span&gt;">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg>
    </button>
  </div>
  <div class="progress-detail" id="progress-detail"></div>
  <div class="progress-track" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="legend" id="legend"></div>

<!-- A simulated run's own history. Absent for every other kind of map, since
     a fetched one has no sequence to step through: the page asks
     /api/timeline and a 404 is the honest "nothing to show" rather than an
     error worth a toast. -->
<div class="timeline" id="timeline" hidden>
  <div class="tl-head">
    <span class="tl-title" id="tl-title"></span>
    <div class="chips" id="tl-chips"></div>
    <button id="tl-details" type="button"
            data-tip="&lt;b&gt;What this roll opened&lt;/b&gt;&lt;span class='sub'&gt;Every task the selected roll made valid, by category.&lt;/span&gt;">Details</button>
    <!-- The way out of a timeline. A run can only be seen in timeline mode, so
         "I want to work with this roll" is answered by making it a real map. -->
    <button id="tl-snapshot" type="button"
            data-tip="&lt;b&gt;Save this roll as a map&lt;/b&gt;&lt;span class='sub'&gt;The world after the selected roll, as a map of its own — which browses, edits and diffs like any other.&lt;/span&gt;">Snapshot</button>
    <button id="tl-hours" type="button"
            data-tip="&lt;b&gt;Cost every step&lt;/b&gt;&lt;span class='sub'&gt;Derives and prices the world after each roll, then stores the answer beside the run.&lt;/span&gt;&lt;span class='hint'&gt;Slow once, instant after&lt;/span&gt;">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-clock"/></svg>Compute hours
    </button>
    <span class="spacer"></span>
    <button id="tl-collapse" class="icon-btn" type="button" aria-expanded="true"
            data-tip="&lt;b&gt;Collapse&lt;/b&gt;&lt;span class='sub'&gt;Keep the slider, hide the graph.&lt;/span&gt;">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-down"/></svg>
    </button>
  </div>
  <div class="tl-graph" id="tl-graph"></div>
  <div class="tl-scrub">
    <button id="tl-prev" class="icon-btn" type="button" aria-label="Previous roll"
            data-tip="&lt;b&gt;Back one roll&lt;/b&gt;&lt;span class='hint'&gt;&amp;larr;&lt;/span&gt;">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-prev"/></svg>
    </button>
    <input id="tl-slider" class="tl-slider" type="range" min="0" max="0" value="0" step="1"
           aria-label="Roll to show">
    <button id="tl-next" class="icon-btn" type="button" aria-label="Next roll"
            data-tip="&lt;b&gt;Forward one roll&lt;/b&gt;&lt;span class='hint'&gt;&amp;rarr;&lt;/span&gt;">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-next"/></svg>
    </button>
    <span class="tl-step" id="tl-step"></span>
  </div>
</div>

<!-- The tiles are the OSRS wiki's, CC BY-NC-SA 3.0, loaded straight from their
     CDN by the browser. Attribution is what that licence asks for and this is
     the whole of what it costs when you link rather than copy. -->
<!-- Which install is serving this page, against the map's bottom-left. Not
     decoration: two venvs is the normal state of this project and a stale one
     looks exactly like a fresh one until something disagrees. -->
<div class="watermark" id="watermark" hidden></div>

<div class="attribution" id="attribution" hidden></div>
<!-- The way out of a mode, floating over the map rather than hiding in the
     bar: a mode you can see you are in needs a way out you can see too. It
     reads `--strip-h`, so it rides above the timeline instead of behind it. -->
<button class="exit-pill" id="exit-mode" type="button" hidden></button>

<div class="toast" id="toast" hidden></div>

<!-- One dialog, reused. The "what would this add?" answer used to overwrite
     the chunk panel with no way back; an overlay you dismiss is the shape
     that fits an answer you asked a question to get. -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <header>
      <h2 id="overlay-title"></h2>
      <button id="overlay-close" class="icon-btn" type="button" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg>
      </button>
    </header>
    <div id="overlay-body"></div>
    <footer id="overlay-actions" hidden></footer>
  </div>
</div>

<div class="tip" id="tip" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
